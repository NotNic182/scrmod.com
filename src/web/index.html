<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c3440" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Before first paint: apply the saved (or system) theme so light-mode visitors never see a dark flash
         while the app downloads. Mirrors lib/theme.ts; the key must stay in sync. -->
    <script>
      try {
        var t = localStorage.getItem("scrhub.theme")
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <!-- Start the entry page's data now, alongside the app download, instead of after it. hubGet() (api/client.ts)
         takes each response once. Paths mirror api/hooks.ts; a mismatch only costs the head start. -->
    <script>
      try {
        var base = "%BASE_URL%".replace(/\/$/, "")
        var p = location.pathname.slice(base.length).replace(/\/$/, "") || "/"
        var want = []
        var m
        if (p === "/") want.push("/home", "/stream")
        else if (p === "/watch") want.push("/stream")
        else if ((m = /^\/leaderboards(?:\/([\w-]+))?$/.exec(p))) want.push("/leaderboard/" + (m[1] || "1v1"), "/meta")
        else if ((m = /^\/players\/(\d{17})$/.exec(p))) {
          // The profile request names the pinned viewer (for head-to-head), exactly as usePlayer() does on first render.
          var me = null
          try {
            me = JSON.parse(localStorage.getItem("scrhub.me") || "null").steam_id
          } catch (e) {}
          want.push("/players/" + m[1] + (me && me !== m[1] ? "?me=" + me : ""), "/meta")
        } else if ((m = /^\/tournaments(?:\/([0-9a-f-]{36}))?$/i.exec(p))) {
          want.push("/tournaments", "/tournaments/history")
          if (m[1]) want.push("/tournaments/" + m[1] + "/bracket")
        } else if ((m = /^\/cards\/([^/]+)$/.exec(p))) want.push("/card/" + m[1])
        var early = (window.__scrEarly = {})
        want.forEach(function (w) {
          var res = fetch(base + "/api" + w, { headers: { Accept: "application/json" }, credentials: "same-origin" })
          res.catch(function () {}) // an unused failure stays quiet; the page's own request still sees it and retries
          early[w] = res
        })
      } catch (e) {}
    </script>
    <!--seo:head:start-->
    <title>SCRmod</title>
    <meta name="description" content="Sid's Competitive Rounds from your browser: who is online, live games, leaderboards and stats." />
    <meta property="og:site_name" content="SCRmod" />
    <meta property="og:title" content="SCRmod · scrmod.com" />
    <meta property="og:description" content="Sid's Competitive Rounds from your browser: who is online, live games, leaderboards and stats." />
    <meta property="og:image" content="https://scrmod.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:head:end-->
  </head>
  <body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
